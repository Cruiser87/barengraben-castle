<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bärengraben Castle</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;900&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: a cozy storybook game — warm, gentle, never in a hurry
   IDEA: a Victorian toy theatre of Bern: velvet curtains, gold trim, cobbled street stage
   PICTURE: the eye-level street itself, full width, bears walking past shop windows
   COLOUR and TYPE: burgundy velvet + cream paper + gold leaf, turquoise river accent; Playfair Display + Nunito
   LAYOUT: velvet bar on top (bears + coins), location ribbon, stage fills the screen, dock below, honey pot floating */
:root{color-scheme:light;--vel:#6e1a2a;--vel2:#4d1020;--gold:#c9a227;--gold2:#f2d27a;--paper:#fbf4e4;--paper2:#f3e7cf;--ink:#3b2a1f;--teal:#2fb3bc;--em:#1f6b4a}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;background:var(--vel2);color:var(--ink);font:16px/1.45 Nunito,system-ui,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
#app{display:grid;grid-template-rows:auto auto 1fr auto;height:100vh;height:100dvh}
header{display:flex;gap:10px;align-items:center;padding:8px 12px;background:linear-gradient(var(--vel),var(--vel2));border-bottom:3px solid var(--gold);color:#fdf3d6}
#bears{display:flex;gap:6px;overflow-x:auto;flex:1;scrollbar-width:none;padding:2px}
#bears::-webkit-scrollbar{display:none}
.chip{display:flex;align-items:center;gap:6px;flex:none;background:rgba(255,255,255,.08);border:2px solid transparent;border-radius:40px;padding:3px 12px 3px 3px;color:#fdf3d6;min-height:48px}
.chip.on{background:var(--paper);color:var(--ink);border-color:var(--gold2);box-shadow:0 0 0 3px rgba(242,210,122,.35)}
.chip .av{width:40px;height:40px;border-radius:50%;background:#fff3;display:block;overflow:hidden}
.chip.on .av{background:#efe1c1}
.av svg{width:100%;height:100%;display:block}
.chip .nm{display:flex;flex-direction:column;line-height:1.1;font-weight:800;font-size:15px;text-align:left}
.chip .nm small{font-weight:600;font-size:12px;opacity:.75}
.chip.add{padding:3px 14px;font-size:22px;border:2px dashed #fdf3d688}.chip.add .nm{font-size:14px}
#savebtn{flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;background:linear-gradient(#e9c95a,#b8901d);color:#3b2410;border:2px solid var(--gold2);border-radius:16px;padding:4px 14px;min-height:48px;box-shadow:0 3px 0 #5a3d08}
#savebtn b{font-weight:900;font-size:15px;letter-spacing:.02em}#savebtn small{font-size:11px;font-weight:700;opacity:.8}#savebtn:active{transform:translateY(2px);box-shadow:0 1px 0 #5a3d08}
#savepop{position:fixed;top:78px;right:12px;z-index:85;width:min(380px,calc(100vw - 24px));background:var(--paper);border:4px solid var(--gold);border-radius:18px;padding:12px 16px;box-shadow:0 12px 30px #0006;display:none}
#savepop.show{display:block;animation:pop2 .3s ease}#savepop .sp-h{font:900 24px 'Playfair Display',Georgia,serif;color:var(--em)}#savepop p{margin:4px 0 6px;font-size:14px}
#coins{flex:none;text-align:right;line-height:1.1;display:flex;flex-direction:column;align-items:flex-end}
#coins b{font:900 22px 'Playfair Display',Georgia,serif;color:var(--gold2)}#coins span{font-size:12px;opacity:.8}#coins em{font-style:normal;font-size:12px;color:#ffd0d0}
#loc{display:flex;align-items:center;gap:8px;padding:6px 14px;background:var(--paper);border-bottom:2px solid var(--gold);font-size:15px;white-space:nowrap;overflow:hidden}
#loc .where{overflow:hidden;text-overflow:ellipsis;flex:1}
#loc .realbtn{flex:none;background:var(--teal);color:#fff;border:0;border-radius:20px;padding:4px 12px;font-weight:800;font-size:13px;min-height:30px}
#realwalk{position:fixed;inset:0;z-index:75;background:#1c0b10;display:none;flex-direction:column}
#realwalk.show{display:flex;animation:pop2 .3s ease}
.rw-top{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:8px 12px;background:linear-gradient(var(--vel),var(--vel2));border-bottom:3px solid var(--gold);color:#fdf3d6}
.rw-top .row{margin:0}.rw-top a.btn{text-decoration:none;display:inline-flex;align-items:center}
.rw-t{display:flex;gap:10px;align-items:center}.rw-t .av{width:48px;height:48px;border-radius:50%;background:var(--paper);flex:none;overflow:hidden}.rw-t b{display:block;font:700 19px 'Playfair Display',Georgia,serif}.rw-t small{opacity:.85}
.rw-frame{position:relative;flex:1}.rw-frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#2a2a2a}
.rw-note{position:absolute;left:12px;bottom:12px;background:#fffaf0e6;border-radius:12px;padding:4px 12px;font-size:13px;pointer-events:none}
.rw-out{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:var(--paper);text-align:center;padding:20px}
.rw-out .rw-pic{width:min(220px,50vw);aspect-ratio:260/300}.rw-out .rw-pic svg{width:100%;height:100%}.rw-out a.btn{text-decoration:none}
#loc .month{flex:none;background:var(--em);color:#fff;border:0;border-radius:20px;padding:4px 12px;font-weight:800;font-size:13px}
#stage{position:relative;z-index:0;overflow:hidden;background:#9fd3f0}
/* street */
.streetview .scroller{position:absolute;inset:0;overflow-x:auto;overflow-y:hidden;scroll-behavior:auto}
.swrap{position:relative;height:100%;width:auto}
.swrap>svg{height:100%;width:auto;display:block}
.bld{cursor:pointer}.bld:hover>*{filter:brightness(1.06)}
.hint{position:absolute;left:12px;bottom:10px;background:#fffaf0dd;border-radius:20px;padding:4px 12px;font-size:13px;pointer-events:none}
.bear{position:absolute;pointer-events:none}
.walker,.npc{top:59%;height:27%;aspect-ratio:260/300;transform:translateX(-50%);z-index:5}
.npc{pointer-events:auto;cursor:pointer;height:24%;top:62%;z-index:4;filter:saturate(.95)}
.npc .tag,.rb .tag{position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);background:#fffaf0;border:2px solid var(--gold);border-radius:12px;padding:0 8px;font-size:12px;font-weight:800;white-space:nowrap}
.bwrap,.bwrap svg{width:100%;height:100%;display:block}
.walker.left .bwrap{transform:scaleX(-1)}
.walking .bwrap svg{animation:bob .34s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(0) rotate(-3deg)}to{transform:translateY(-5%) rotate(3deg)}}
.twirl .bwrap{animation:twirl .8s ease}
@keyframes twirl{0%{transform:rotateY(0)}100%{transform:rotateY(720deg)}}
.fxs{position:absolute;inset:0;pointer-events:none}
.fl{position:absolute;bottom:70%;font-size:clamp(18px,3vw,30px);animation:rise 2.4s ease-out forwards;opacity:0}
.fl.coin{font:900 18px 'Playfair Display',Georgia;color:#7a4a08;background:#fff3c4;border-radius:12px;padding:1px 8px;animation-duration:1.5s;left:30%}
@keyframes rise{0%{opacity:0;transform:translateY(0) scale(.6)}15%{opacity:1}100%{opacity:0;transform:translateY(-120%) scale(1.1)}}
.bub{position:absolute;bottom:96%;left:50%;transform:translateX(-50%);background:#fff;border:3px solid var(--ink);border-radius:20px;padding:6px 14px;font-weight:800;font-size:clamp(13px,1.6vw,16px);white-space:nowrap;animation:pop .3s ease;box-shadow:0 4px 0 #0002}
.bub::after{content:"";position:absolute;left:44%;bottom:-16px;width:12px;height:12px;border-radius:50%;background:#fff;border:3px solid var(--ink)}
@keyframes pop{from{transform:translateX(-50%) scale(.4)}}
.flash{position:absolute;inset:0;background:#fff;opacity:0;animation:fl .45s ease;pointer-events:none;z-index:50}.flash.big{animation-duration:.6s}
@keyframes fl{20%{opacity:.75}}
/* picture views */
.pic{display:grid;grid-template-rows:1fr auto}
.picbox{position:relative;overflow:hidden}
.picbox>svg{position:absolute;inset:0;width:100%;height:100%}
.bear.center{left:30%;bottom:4%;height:44%;aspect-ratio:260/300;transform:translateX(-50%)}
.bear.center.napping .bwrap{transform:rotate(-70deg)}
.caption{position:absolute;left:14px;top:12px;max-width:min(420px,70%);background:#fffaf0ee;border:3px solid var(--gold);border-radius:14px;padding:8px 14px;display:flex;flex-direction:column}
.caption b{font:700 clamp(17px,2.2vw,22px) 'Playfair Display',Georgia,serif}.caption span{font-size:14px}
.bar{display:flex;gap:8px;align-items:center;padding:8px 10px;background:var(--paper);border-top:2px solid var(--gold);overflow-x:auto;flex-wrap:nowrap}
.bar .note{font-size:13px;opacity:.7;white-space:nowrap}
.bar .sel{display:flex;gap:6px}
/* castle */
.castle{display:grid;grid-template-rows:auto 1fr auto;background:#3b2414}
.tabs{display:flex;gap:4px;padding:6px 8px 0;overflow-x:auto;background:#3b2414}
.tab{flex:none;border:0;border-radius:12px 12px 0 0;padding:8px 14px;background:#6b4a33;color:#fdf3d6;font-weight:800;min-height:40px}
.tab.on{background:var(--paper);color:var(--ink)}.tab.add{background:transparent;border:2px dashed #fdf3d688}
.roombox{position:relative;background:radial-gradient(#5a3a26,#2b1a10);display:flex;align-items:center;justify-content:center;overflow:hidden;padding:0}
.room{position:relative;width:100%;height:100%}
.room>svg{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.roombears{position:absolute;inset:0;pointer-events:none}
.rb{height:33%;aspect-ratio:260/300;transform:translateX(-50%);transition:left .6s ease,top .6s ease}
.rb.sit{height:30%}.rb.nap .bwrap{transform:rotate(-72deg) scale(.95)}
.it{cursor:pointer}.it:hover{filter:brightness(1.08)}
.it.selected{filter:drop-shadow(0 0 6px #ffd54f) drop-shadow(0 0 2px #fff)}
.flame{animation:flick 1.2s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes flick{to{transform:scaleY(1.12) scaleX(.94)}}
.twinkle{animation:tw 1.6s ease-in-out infinite alternate}@keyframes tw{to{opacity:.45}}
.pend{animation:pend 2s ease-in-out infinite alternate;transform-box:view-box;transform-origin:0 -200px}@keyframes pend{from{transform:rotate(-8deg)}to{transform:rotate(8deg)}}
.swim{animation:swim 6s ease-in-out infinite alternate}@keyframes swim{to{transform:translateX(60px)}}
.waves{animation:wv 3s ease-in-out infinite alternate}@keyframes wv{to{transform:translateX(-30px)}}
.snowdot{animation:snow 6s linear infinite}@keyframes snow{to{transform:translateY(120px)}}
/* inside scenes */
.scene{display:grid;grid-template-rows:1fr auto;background:#2b1a10}
.scenebox{position:relative;display:flex;align-items:flex-end;justify-content:center;overflow:hidden;background:radial-gradient(#5a3a26,#1c0b10)}
.sbox{position:relative;flex:none}
.sbox>svg,.sbox>.bdimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.spots{position:absolute;inset:0}
.sp{position:absolute;border:3px dashed transparent;background:transparent;border-radius:18px;padding:0;cursor:pointer;z-index:2}
.sp::after{content:"✨";position:absolute;right:-4px;top:-6px;font-size:clamp(12px,1.6vw,20px);animation:tw 1.4s ease-in-out infinite alternate;pointer-events:none}
.sp.badge::after,.imgmode .sp::after{display:none}
.sp:hover,.sp:focus-visible{border-color:#ffe08a;background:#fff6c826;box-shadow:0 0 26px #ffe08a99;outline:none}
.sp .sl{position:absolute;left:50%;bottom:2px;transform:translateX(-50%);background:#fffaf0f2;border:2px solid var(--gold);border-radius:12px;padding:1px 8px;font-size:clamp(10px,1.15vw,13px);font-weight:800;white-space:nowrap;color:var(--ink);pointer-events:none;max-width:260px;overflow:hidden;text-overflow:ellipsis}
.sp .bdg{display:none}
.sp.badge .bdg,.imgmode .sp .bdg{display:flex;position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);width:min(68px,70%);aspect-ratio:1;border-radius:50%;background:#fffaf0;border:4px solid var(--gold);align-items:center;justify-content:center;font-size:clamp(18px,2.6vw,34px);box-shadow:0 0 0 6px #ffe08a55,0 6px 14px #0004;animation:pulse 2.2s ease-in-out infinite}
.sp.hasart .bdg{display:none}
@keyframes pulse{50%{box-shadow:0 0 0 12px #ffe08a22,0 6px 14px #0004}}
.sp .spfood{position:absolute;left:8%;top:0;width:84%;height:80%}
.sp .spbear,.sp .spfurn,.sp .spemoji{position:absolute;left:10%;top:0;width:80%;height:78%;display:flex;align-items:center;justify-content:center}
.sp .spbear svg{width:100%;height:100%}.sp .spemoji{font-size:clamp(26px,4vw,52px)}
.bear.sb{height:34%;aspect-ratio:260/300;transform:translateX(-50%);transition:left .55s ease,top .55s ease;z-index:3;pointer-events:none}
.bear.sb.sit{height:31%}.bear.sb.nap .bwrap{transform:rotate(-72deg) scale(.95)}
.riding .ride{animation:ride 16s linear}
@keyframes ride{from{transform:translateX(0)}to{transform:translateX(-1500px)}}
.riding .bear.sb .bwrap{animation:bob 1.1s ease-in-out infinite alternate}
.showov{position:absolute;inset:0;z-index:4;pointer-events:none;overflow:hidden}
.showov .cur{position:absolute;top:0;bottom:0;width:50%;background:repeating-linear-gradient(90deg,#9b0000 0 30px,#7a0000 30px 60px);animation:curtain 1.4s ease forwards}
.showov .cur.l{left:0;transform-origin:left}.showov .cur.r{right:0;transform-origin:right}
@keyframes curtain{to{transform:scaleX(.12)}}
.stagelights{position:absolute;left:20%;right:20%;top:30%;display:flex;justify-content:space-around;font-size:clamp(26px,5vw,60px)}
.stagelights span{opacity:0;animation:pop3 .6s ease forwards}@keyframes pop3{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:scale(1)}}
.caption.flashcap{animation:pop2 .35s ease}
.btn.teal{border-color:var(--teal);color:#0f5f65}
.artview svg{width:min(520px,100%);display:block;margin:0 auto}
.plaque{margin:10px auto 0;max-width:420px;background:#fffaf0;border:3px solid var(--gold);border-radius:8px;padding:8px 14px;text-align:center;display:flex;flex-direction:column}
.plaque b{font:700 20px 'Playfair Display',Georgia,serif}
.itemview{display:grid;grid-template-columns:minmax(0,220px) 1fr;gap:16px;align-items:center}
.ivart{aspect-ratio:1;background:var(--paper2);border-radius:18px;display:flex;align-items:center;justify-content:center;overflow:hidden}.ivart svg{width:92%;height:92%}.bigemoji{font-size:110px}
@media (max-width:560px){.itemview{grid-template-columns:1fr}.ivart{max-width:220px;margin:auto}}
.foodsvg,.cardfood,.mini,.menufood{width:64px;height:64px;display:block}.card .ic .cardfood{width:60px;height:60px}
.wcard.food{font-size:14px}.wcard .menufood{width:84px;height:84px}.menu .row{margin:4px 0 0;gap:4px;flex-wrap:wrap;justify-content:center}
.wmini{width:72px;height:72px;display:block}.wmini svg{width:100%;height:100%}
.card .ic>svg{width:100%;height:100%}
/* dock */
nav{display:flex;gap:6px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:linear-gradient(var(--vel2),var(--vel));border-top:3px solid var(--gold);overflow-x:auto}
nav button{flex:none;display:flex;flex-direction:column;align-items:center;gap:1px;background:rgba(255,255,255,.08);color:#fdf3d6;border:0;border-radius:14px;padding:6px 10px;min-width:64px;min-height:52px;font-weight:800;font-size:12px;position:relative}
nav button span{font-size:22px;line-height:1}
nav button.home{background:var(--paper);color:var(--ink);padding:6px 14px}
nav button:focus-visible,.btn:focus-visible,.chip:focus-visible{outline:3px solid var(--gold2);outline-offset:2px}
#gift{position:absolute;top:2px;right:4px;font-size:14px;animation:tw 1s infinite alternate}
.btn{border:2px solid var(--vel);background:#fffaf0;color:var(--vel);border-radius:22px;padding:8px 14px;font-weight:800;font-size:15px;white-space:nowrap;min-height:44px;flex:none}
.btn:hover{background:#fff}.btn.on,.btn.gold{background:var(--vel);color:#fdf3d6;border-color:var(--gold)}
.btn.gold{background:linear-gradient(#d8b440,#b8901d);color:#3b2410;border-color:#8a6d10}
.btn.ghost{background:transparent;border-style:dashed}.btn.small{min-height:36px;padding:5px 12px;font-size:14px}.btn.big{font-size:17px;padding:12px 20px}
/* honey pot */
#pot{position:fixed;right:10px;bottom:84px;width:clamp(96px,13vw,150px);aspect-ratio:1;border:0;background:radial-gradient(circle,#fff6c8aa,transparent 65%);border-radius:50%;z-index:30;padding:0;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
#pot #potsvg,#pot svg{width:100%;height:100%;display:block;pointer-events:none}
#pot .lbl2{position:absolute;left:50%;bottom:-2px;transform:translateX(-50%);background:var(--vel);color:var(--gold2);border:2px solid var(--gold);border-radius:12px;padding:0 8px;font-size:11px;font-weight:800;white-space:nowrap;pointer-events:none}
#pot.bop svg{animation:bop .22s ease}@keyframes bop{50%{transform:scale(.9) rotate(-4deg)}}
.potfloat{position:absolute;left:50%;top:0;transform:translateX(-50%);font:900 22px 'Playfair Display',Georgia;color:#fff3c4;text-shadow:0 2px 0 #7a4a08,0 0 8px #7a4a08;white-space:nowrap;animation:pf 1.4s ease-out forwards;pointer-events:none}
.potfloat.big{font-size:28px;color:#ffe066}
@keyframes pf{to{transform:translate(-50%,-120px);opacity:0}}
.drop{position:absolute;left:45%;top:30%;font-size:22px;animation:drop 1s ease-out forwards;pointer-events:none}
@keyframes drop{to{transform:translate(var(--dx),-90px) rotate(180deg);opacity:0}}
.bee{position:absolute;left:50%;top:50%;font-size:18px;animation:orbit 4s linear infinite;pointer-events:none}
@keyframes orbit{from{transform:rotate(0) translateX(70px) rotate(0)}to{transform:rotate(360deg) translateX(70px) rotate(-360deg)}}
/* month fx */
#fx{position:fixed;inset:0;pointer-events:none;z-index:20;overflow:hidden}
#fx span{position:absolute;top:-40px;font-size:22px;opacity:.75;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(110vh) rotate(260deg)}}
/* modal */
#modal{position:fixed;inset:0;background:#2a0b12aa;display:none;align-items:center;justify-content:center;z-index:60;padding:12px}
#modal.show{display:flex}
.sheet{background:var(--paper);border:4px solid var(--gold);border-radius:22px;width:min(860px,100%);max-height:100%;display:flex;flex-direction:column;box-shadow:0 20px 60px #0008;animation:pop2 .25s ease}
.wide .sheet{width:min(1100px,100%)}
@keyframes pop2{from{transform:scale(.92);opacity:0}}
.mh{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;border-bottom:2px solid var(--paper2);background:linear-gradient(var(--paper),var(--paper2));border-radius:18px 18px 0 0}
.mh h2{margin:0;font:700 clamp(20px,3vw,28px)/1.1 'Playfair Display',Georgia,serif;color:var(--vel)}
.x{border:0;background:var(--vel);color:#fff;width:40px;height:40px;border-radius:50%;font-size:18px;flex:none}.x.small{width:28px;height:28px;font-size:13px}
.mb{padding:14px 18px 20px;overflow-y:auto}
.mb h3{font:700 18px 'Playfair Display',Georgia,serif;margin:16px 0 8px;color:var(--vel)}
.lede{margin:0 0 12px}.note{font-size:13px;opacity:.75}.empty{padding:20px;text-align:center;opacity:.7}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(230px,100%),1fr));gap:10px}
.grid.tight{grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.card{display:grid;grid-template-columns:64px 1fr;grid-template-rows:auto auto;gap:4px 10px;background:#fffaf0;border:2px solid var(--paper2);border-radius:16px;padding:10px;align-items:center}
.card .ic{grid-row:span 2;width:64px;height:64px;border-radius:14px;background:var(--paper2);display:flex;align-items:center;justify-content:center;font-size:36px;position:relative;overflow:hidden}
.card .ic svg{width:100%;height:100%}.card .ic.av svg{width:100%}
.card .cn{display:flex;flex-direction:column;line-height:1.2}.card .cn small{opacity:.75}
.card .cb{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.have{font-size:12px;opacity:.75}
.sw{position:absolute;left:4px;top:4px;width:14px;height:14px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #0003}
.wcard{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;background:#fffaf0;border:2px solid var(--paper2);border-radius:14px;padding:10px 6px;font-size:30px;min-height:96px}
.wcard small{font-size:12px;line-height:1.15;text-align:center;font-weight:700}
.wcard em{font-style:normal;font-size:11px;font-weight:800;color:#fff;background:var(--em);border-radius:10px;padding:0 6px}
.wcard em.from{background:transparent;color:var(--ink);opacity:.6;font-weight:600}
.wcard.on{border-color:var(--em);background:#eaf6ef}.wcard .big{font-size:36px}.wcard svg.mini{width:64px;height:60px}
.ctabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:4px}
.ctabs .tab{border-radius:20px;background:var(--paper2);color:var(--ink)}.ctabs .tab.on{background:var(--vel);color:#fdf3d6}
.search{width:100%;font:inherit;font-size:16px;padding:10px 14px;border-radius:14px;border:2px solid var(--paper2);margin-bottom:12px;background:#fff}
.row{display:flex;gap:10px;align-items:center;margin:10px 0}.row.wrap{flex-wrap:wrap}
.swrow{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:6px 0 10px}
.swb{width:40px;height:40px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px #0002}.swb.on{box-shadow:0 0 0 3px var(--vel)}
input[type=color]{width:44px;height:44px;border:0;padding:0;background:none}
.lbl{display:flex;align-items:center;gap:8px;font-weight:700;margin:6px 0}
select,.lbl input:not([type=range]),.newbear input{font:inherit;font-size:16px;padding:8px 12px;border-radius:12px;border:2px solid var(--paper2);background:#fff;min-height:44px}
textarea{width:100%;font:13px monospace;border-radius:12px;border:2px solid var(--paper2);padding:8px;margin-top:6px}
.names{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}.tag2{border:2px solid var(--paper2);background:#fff;border-radius:16px;padding:4px 10px;font-weight:700;min-height:36px}
.colors{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
.bc{display:flex;flex-direction:column;align-items:center;gap:4px;background:#fffaf0;border:2px solid var(--paper2);border-radius:16px;padding:10px;font-weight:700;font-size:14px;cursor:pointer}
.bc span{width:76px;height:76px}.bc span svg{width:100%;height:100%}.bc:has(input:checked){border-color:var(--em);background:#eaf6ef}.bc input{position:absolute;opacity:0}
.bc2{display:flex;gap:6px;align-items:center;font-weight:700;min-height:44px}
.names2 .av{width:40px;height:40px;display:block}
.bank .bal{display:flex;gap:12px;margin-bottom:12px}.bank .bal div{flex:1;background:#fffaf0;border:2px solid var(--gold);border-radius:16px;padding:12px;display:flex;flex-direction:column}.bank b{font:900 26px 'Playfair Display',Georgia}
.dest{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(240px,100%),1fr));gap:10px}
.destb{display:flex;flex-direction:column;align-items:flex-start;text-align:left;background:#fffaf0;border:2px solid var(--paper2);border-radius:16px;padding:12px 14px;gap:2px}
.destb:hover{border-color:var(--gold)}.dn{font:700 19px 'Playfair Display',Georgia}.ds{font-size:13px;opacity:.75}.dt{margin-top:6px;font-weight:800;color:var(--vel);font-size:14px}
.pcity{background:#fffaf0;border:2px solid var(--paper2);border-radius:16px;padding:8px 12px;margin-bottom:10px}.pcity.done{border-color:var(--gold);background:#fff8e1}
.pcity h3{margin:4px 0 8px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.pcity h3 small{font:700 13px Nunito}
.stamps{display:flex;flex-wrap:wrap;gap:8px}.stamp{display:flex;flex-direction:column;align-items:center;width:84px;font-size:26px;border:2px dashed #c9b99a;border-radius:50%/40%;padding:6px 4px;color:#b8ab90;text-align:center}
.stamp small{font-size:10px;line-height:1.1;font-weight:700}.stamp.on{border:3px solid #b03a2e;color:#b03a2e;transform:rotate(-4deg);background:#fff}
.album{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(240px,100%),1fr));gap:14px}
.album figure{margin:0;background:#fff;padding:10px 10px 6px;border-radius:6px;box-shadow:0 4px 14px #0002;position:relative;transform:rotate(-1deg)}.album figure:nth-child(2n){transform:rotate(1.2deg)}
.ph{position:relative;aspect-ratio:4/3;overflow:hidden;background:#ddd}.ph>svg{position:absolute;inset:0;width:100%;height:100%}
.pb{position:absolute;left:50%;bottom:2%;height:52%;aspect-ratio:260/300;transform:translateX(-50%)}.pb svg{width:100%;height:100%}
figcaption{font:700 15px 'Playfair Display',Georgia;padding-top:6px;display:flex;justify-content:space-between;gap:6px}figcaption small{font:600 12px Nunito;opacity:.6}
.album .x{position:absolute;right:4px;top:4px}
.story{background:#fffaf0;border-left:5px solid var(--gold);border-radius:8px;padding:10px 14px;margin:10px 0}.story h4{margin:0 0 4px;font-size:13px;opacity:.7}.story p{margin:0;font:500 17px/1.55 Georgia,serif}
.postcard svg{width:min(320px,100%);display:block;margin:0 auto 10px}
.giftopen{text-align:center}.giftopen .box{font-size:70px;animation:shake .6s ease 2}.giftopen .prize{font-size:80px;animation:pop2 .6s ease .9s both}
@keyframes shake{25%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}}
.welcome .trio{display:flex;justify-content:center;gap:4px}.welcome .trio span{width:min(150px,30%);aspect-ratio:260/300}.welcome .trio svg{width:100%;height:100%}
.welcome ul{padding-left:20px}.welcome li{margin:6px 0}
.unpack{background:#fff8e1;border:2px solid var(--gold);border-radius:16px;padding:8px 14px 14px}
.confirm{position:fixed;inset:0;z-index:80;background:#2a0b1288;display:flex;align-items:center;justify-content:center;padding:16px}
.cbox{background:var(--paper);border:4px solid var(--gold);border-radius:20px;padding:18px 22px;max-width:440px}.cbox p{font-weight:800;font-size:17px;margin:0 0 6px}
#toasts{position:fixed;left:50%;top:120px;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:min(560px,92vw)}
.toast{background:var(--paper);border:3px solid var(--gold);border-radius:16px;padding:8px 16px;font-weight:800;box-shadow:0 8px 24px #0004;animation:pop2 .3s ease;text-align:center}.toast.out{opacity:0;transition:opacity .5s}
#travelov{position:fixed;inset:0;z-index:70;display:none;align-items:center;justify-content:center;flex-direction:column;background:linear-gradient(#9fd3f0,#fbf4e4);font:700 28px 'Playfair Display',Georgia;color:var(--vel)}
#travelov.show{display:flex;animation:fl2 .85s ease}#travelov div{font-size:90px;animation:zoom .85s ease}
@keyframes fl2{0%{opacity:0}20%,80%{opacity:1}100%{opacity:0}}@keyframes zoom{from{transform:translateX(-40vw)}to{transform:translateX(40vw)}}

/* ============ SOUND: procedural ambience + gentle music ============ */
const SND={ctx:null,master:null,bus:null,vol:.55,muted:false,cur:null,timers:[],nodes:[],noise:null,musicOn:true};
function sndInit(){if(SND.ctx)return true;try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return false;SND.ctx=new AC();SND.master=SND.ctx.createGain();SND.master.gain.value=SND.muted?0:SND.vol;SND.master.connect(SND.ctx.destination);
 const len=SND.ctx.sampleRate*2,b=SND.ctx.createBuffer(1,len,SND.ctx.sampleRate),d=b.getChannelData(0);let last=0;for(let i=0;i<len;i++){const w=Math.random()*2-1;last=(last+.02*w)/1.02;d[i]=w*.5+last*3}SND.noise=b;return true}catch(e){return false}}
function sndVolume(v){SND.vol=v;if(SND.master)SND.master.gain.setTargetAtTime(SND.muted?0:v,SND.ctx.currentTime,.1)}
function sndMute(m){SND.muted=m;sndVolume(SND.vol)}
function mtof(m){return 440*Math.pow(2,(m-69)/12)}
function noiseSrc(){const s=SND.ctx.createBufferSource();s.buffer=SND.noise;s.loop=true;s.start();return s}
function stopProfile(){const t=SND.ctx.currentTime;SND.timers.forEach(clearInterval);SND.timers.forEach(clearTimeout);SND.timers=[];if(SND.bus){const b=SND.bus;b.gain.setTargetAtTime(0,t,.4);setTimeout(()=>{try{b.disconnect()}catch(e){}},2500)}SND.nodes.forEach(n=>setTimeout(()=>{try{n.stop()}catch(e){}},2500));SND.nodes=[]}
function nlayer(type,g){const c=SND.ctx,src=noiseSrc();SND.nodes.push(src);const f=c.createBiquadFilter(),gn=c.createGain();gn.gain.value=g;
 if(type=="river"){f.type="bandpass";f.frequency.value=900;f.Q.value=.6;const l=c.createOscillator(),lg=c.createGain();l.frequency.value=.13;lg.gain.value=300;l.connect(lg);lg.connect(f.frequency);l.start();SND.nodes.push(l)}
 else if(type=="waves"){f.type="lowpass";f.frequency.value=600;const l=c.createOscillator(),lg=c.createGain();l.frequency.value=.11;lg.gain.value=g*.8;l.connect(lg);lg.connect(gn.gain);l.start();SND.nodes.push(l)}
 else if(type=="fountain"){f.type="highpass";f.frequency.value=1800}
 else if(type=="fire"){f.type="lowpass";f.frequency.value=260}
 else if(type=="city"){f.type="lowpass";f.frequency.value=380}
 else if(type=="chatter"){f.type="bandpass";f.frequency.value=1100;f.Q.value=1.6;const l=c.createOscillator(),lg=c.createGain();l.frequency.value=4.3;lg.gain.value=g*.6;l.connect(lg);lg.connect(gn.gain);l.start();SND.nodes.push(l)}
 else if(type=="room"){f.type="lowpass";f.frequency.value=200}

function env(node,t,a,d,peak,out){const g=SND.ctx.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(peak,t+a);g.gain.exponentialRampToValueAtTime(.0008,t+a+d);node.connect(g);g.connect(out||SND.bus);return g}
function tone(inst,midi,t,dur,vel,out){const c=SND.ctx;out=out||SND.bus;vel=vel||1;const f=mtof(midi);
 if(inst=="musicbox"||inst=="pluck"){[1,4.01,2].forEach((m,i)=>{const o=c.createOscillator();o.type="sine";o.frequency.value=f*m;env(o,t,.005,inst=="pluck"?.6:1.4/(i+1),.09*vel/(i*1.5+1),out);o.start(t);o.stop(t+2)})}
 else if(inst=="bell"){[1,2.76,5.4,8.9].forEach((m,i)=>{const o=c.createOscillator();o.frequency.value=f*m;env(o,t,.004,2.6/(i+1),.07*vel/(i+1),out);o.start(t);o.stop(t+3)})}
 else if(inst=="accordion"||inst=="organ"){const lp=c.createBiquadFilter();lp.type="lowpass";lp.frequency.value=inst=="organ"?1400:1700;const g=c.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.045*vel,t+.05);g.gain.setValueAtTime(.045*vel,t+dur*.8);g.gain.linearRampToValueAtTime(0,t+dur);lp.connect(g);g.connect(out);
  [0,6,-5].forEach(dt=>{const o=c.createOscillator();o.type=inst=="organ"?"square":"sawtooth";o.frequency.value=f;o.detune.value=dt;o.connect(lp);o.start(t);o.stop(t+dur+.05)})}
 else if(inst=="mandolin"){for(let k=0;k<Math.max(2,Math.round(dur/.09));k++){const o=c.createOscillator();o.type="triangle";o.frequency.value=f;env(o,t+k*.09,.004,.12,.06*vel,out);o.start(t+k*.09);o.stop(t+k*.09+.3)}}
 else if(inst=="strings"){const lp=c.createBiquadFilter();lp.type="lowpass";lp.frequency.value=1100;const g=c.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.03*vel,t+dur*.4);g.gain.linearRampToValueAtTime(0,t+dur*1.1);lp.connect(g);g.connect(out);[0,7].forEach(dt=>{const o=c.createOscillator();o.type="sawtooth";o.frequency.value=f;o.detune.value=dt;o.connect(lp);o.start(t);o.stop(t+dur*1.2)})}
 else if(inst=="bass"){const o=c.createOscillator();o.type="triangle";o.frequency.value=f;env(o,t,.01,dur,.09*vel,out);o.start(t);o.stop(t+dur+.1)}}

function waveSwells(level){const c=SND.ctx;nlayer("waves",level*.45);every(4500,8000,t=>{const s=noiseSrc();const f=c.createBiquadFilter();f.type="lowpass";f.frequency.setValueAtTime(350,t);f.frequency.linearRampToValueAtTime(1500,t+2.2);f.frequency.linearRampToValueAtTime(450,t+5.5);const g=c.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(level,t+2.1);g.gain.linearRampToValueAtTime(level*.35,t+3.2);g.gain.linearRampToValueAtTime(0,t+6);s.connect(f);f.connect(g);g.connect(SND.bus);setTimeout(()=>{try{s.stop()}catch(e){}},6500)})}

function murmur(level){const c=SND.ctx;[320,650,1250].forEach((fq,i)=>{const s=noiseSrc();SND.nodes.push(s);const f=c.createBiquadFilter();f.type="bandpass";f.frequency.value=fq;f.Q.value=2.2;const g=c.createGain();g.gain.value=level*.5;s.connect(f);f.connect(g);g.connect(SND.bus);const id=setInterval(()=>{if(!SND.ctx)return;g.gain.setTargetAtTime(level*(.25+Math.random()*.9),c.currentTime,.08);f.frequency.setTargetAtTime(fq*(.85+Math.random()*.3),c.currentTime,.1)},140+i*60);SND.timers.push(id)});every(2500,6000,t=>{const o=c.createOscillator();o.type="triangle";o.frequency.value=900+Math.random()*500;env(o,t,.005,.08,.02);o.start(t);o.stop(t+.12)})}

function music(opt){const c=SND.ctx;let beat=0,next=c.currentTime+.3;const spb=60/opt.bpm,r=rnd(opt.seed||11);let last=opt.prog[0][1];

  if(b==0&&opt.bass)tone("bass",opt.root-12+ch[0],next,spb*opt.bpb*.9,.9);
  if(opt.oom&&b>0)ch.forEach(n=>tone(opt.inst2||opt.inst,opt.root+n,next,spb*.6,.35));
  if(r()<opt.dens){const pool=ch.concat(ch.map(n=>n+12));let n=pool[Math.floor(r()*pool.length)];if(Math.abs(n-last)>9)n=pool.reduce((a,x)=>Math.abs(x-last)<Math.abs(a-last)?x:a,pool[0]);last=n;tone(opt.inst,opt.root+12+n,next,spb*(opt.legato||.9),.8)}
  beat++;next+=spb;if(beat>opt.bpb*opt.prog.length*8)beat=0}},120);SND.timers.push(id)}

function sfx(name){if(!sndInit()||SND.muted)return;const c=SND.ctx,t=c.currentTime,o=SND.master;
 if(name=="coin"){tone("musicbox",88,t,.2,.9,o);tone("musicbox",95,t+.07,.2,.8,o)}
 else if(name=="jackpot")[0,4,7,12,16,19,24].forEach((n,i)=>tone("musicbox",76+n,t+i*.07,.3,1,o));
 else if(name=="buy")[0,7,12].forEach((n,i)=>tone("pluck",72+n,t+i*.06,.3,1,o));
 else if(name=="twirl")[0,2,4,7,9,12,14].forEach((n,i)=>tone("musicbox",84+n,t+i*.04,.2,.6,o));
 else if(name=="yum"){const os=c.createOscillator();os.frequency.setValueAtTime(400,t);os.frequency.exponentialRampToValueAtTime(800,t+.12);env(os,t,.01,.15,.08,o);os.start(t);os.stop(t+.25)}
 else if(name=="bell")[0,0,0].forEach((n,i)=>tone("bell",84,t+i*.35,2,1,o));
 else if(name=="cuckoo"){tone("pluck",79,t,.3,1.4,o);tone("pluck",75,t+.35,.4,1.4,o);tone("pluck",79,t+1,.3,1.4,o);tone("pluck",75,t+1.35,.4,1.4,o)}
 else if(name=="musicbox")[0,4,7,12,7,4,9,5,7,2,0].forEach((n,i)=>tone("musicbox",79+n,t+i*.28,.3,1,o));
 else if(name=="whoosh"){const s=noiseSrc(),f=c.createBiquadFilter();f.type="bandpass";f.frequency.setValueAtTime(300,t);f.frequency.exponentialRampToValueAtTime(3000,t+.7);s.connect(f);env(f,t,.2,.6,.12,o);setTimeout(()=>{try{s.stop()}catch(e){}},1200)}
 else if(name=="click"){const s=noiseSrc(),f=c.createBiquadFilter();f.type="highpass";f.frequency.value=3000;s.connect(f);env(f,t,.001,.06,.2,o);setTimeout(()=>{try{s.stop()}catch(e){}},200)}
 else if(name=="zzz"){tone("musicbox",67,t,.4,.6,o);tone("musicbox",64,t+.3,.6,.5,o)}
 else if(name=="wow")[0,5,9].forEach((n,i)=>tone("bell",84+n,t+i*.12,1,.5,o));
 else if(name=="horn"){[0,.05].forEach((d,i)=>{const o2=c.createOscillator();o2.type="sawtooth";o2.frequency.value=i?147:110;const f=c.createBiquadFilter();f.type="lowpass";f.frequency.value=600;o2.connect(f);const g=c.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.14,t+.15);g.gain.setValueAtTime(.14,t+1.1);g.gain.linearRampToValueAtTime(0,t+1.5);f.connect(g);g.connect(o);o2.start(t);o2.stop(t+1.6)})}
 else if(name=="cheer"){const s2=noiseSrc(),f=c.createBiquadFilter();f.type="bandpass";f.frequency.value=1000;f.Q.value=.8;s2.connect(f);const g=c.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.25,t+.3);g.gain.linearRampToValueAtTime(0,t+2.4);f.connect(g);g.connect(o);setTimeout(()=>{try{s2.stop()}catch(e){}},2600);for(let k=0;k<18;k++){const s3=noiseSrc(),f3=c.createBiquadFilter();f3.type="highpass";f3.frequency.value=2000;s3.connect(f3);env(f3,t+Math.random()*2,.001,.03,.15,o);setTimeout(()=>{try{s3.stop()}catch(e){}},2600)}}
 else if(name=="stamp"){const os=c.createOscillator();os.type="triangle";os.frequency.value=120;env(os,t,.005,.12,.3,o);os.start(t);os.stop(t+.2);tone("bell",91,t+.1,1,.4,o)}}

  :`<div class="rw-out"><div class="rw-pic">${bearSVG(b,"wonder")}</div><p>Real Street View photos open in a new tab here.</p><a class="btn gold big" href="${gmapsLink(g)}" target="_blank" rel="noopener">🌍 Walk the real ${esc(place)} ↗</a><p class="note">When you're done, come back to this tab. Your bear will be waiting right here.</p></div>`);

const BUBBLE={quiet:["So important to remember.","A very special place."],relax:["Ahh… so comfy.","*happy sigh*","This velvet is heavenly."],nap:["Zzz…","Just a little nap…","Zzz… honey dreams…"],twirl:["Twirl! Do I look lovely?","Sparkly!","I feel fancy!"],wonder:["Wow!","Oh, how beautiful!","Look at that!","Ooooh!"],cozy:["So toasty!","Cozy fireside time."],music:["What a sweet tune!","♪ la la la ♪"],memory:["What a lovely memory!","I remember this trip!"],breeze:["Smell that fresh air!","Wheee, the breeze!"],wish:["I wish for more honey!","Wish made!"]};
function react(type,text,bearId){const b=bearId?bearById(bearId):B();const el=stage().querySelector(`.bear[data-b="${b.id}"]`);if(!el)return;const fx=el.querySelector(".fxs");const icons=REACT[type]||REACT.wonder;
 if(type=="twirl"){el.classList.remove("twirl");void el.offsetWidth;el.classList.add("twirl");sfx("twirl")}
 if(type=="wonder"){const f=document.createElement("div");f.className="flash";stage().appendChild(f);setTimeout(()=>f.remove(),500)}
 if(type=="wonder"||type=="eat"||type=="twirl"){const bw=el.querySelector(".bwrap");bw.innerHTML=bearSVG(b,type=="wonder"?"wonder":"happy");}
 icons.forEach((ic,i)=>{const s=document.createElement("span");s.className="fl";s.textContent=ic;s.style.left=(20+Math.random()*60)+"%";s.style.animationDelay=(i*.22)+"s";fx.appendChild(s);setTimeout(()=>s.remove(),2600)});
 const t=text||pick(BUBBLE[type]||BUBBLE.wonder);if(t){fx.querySelectorAll(".bub").forEach(n=>n.remove());const bb=document.createElement("div");bb.className="bub";bb.textContent=t;fx.appendChild(bb);setTimeout(()=>bb.remove(),3000)}}
function eat(I,bearId){sfx("yum");react("eat",I.msg||("Yum! Best "+I.n.toLowerCase()+" ever!"),bearId)}
function floatAtBear(t){const el=stage().querySelector(`.bear[data-b="${B().id}"]`);if(!el||!el.querySelector(".fxs"))return;const s=document.createElement("span");s.className="fl coin";s.textContent=t;el.querySelector(".fxs").appendChild(s);setTimeout(()=>s.remove(),1600)}
function gatherEat(room){const foods=room.items.filter(i=>ITEMS[i.id]&&ITEMS[i.id].c=="food").map(i=>ITEMS[i.id]);S.bears.forEach((x,i)=>setTimeout(()=>{const f=foods.length?pick(foods):ITEMS.bratwurst;eat(f,x.id);const bb=stage().querySelector(`.bear[data-b="${x.id}"] .bub`);if(bb&&i%2)bb.style.bottom="118%"},i*450))}
/* ---------- honey pot ---------- */
function renderPot(){const u=S.up;const bees=Math.min(8,u.bees);$("#potsvg").innerHTML=`<svg viewBox="0 0 200 200"><ellipse cx="100" cy="186" rx="62" ry="9" fill="#000" opacity=".18"/><path d="M40 70 Q20 150 70 182 H130 Q180 150 160 70Z" fill="#e8a317" stroke="#a86d0c" stroke-width="5"/><path d="M48 92 Q100 108 152 92" stroke="#ffd36b" stroke-width="7" fill="none" opacity=".8"/><rect x="34" y="52" width="132" height="26" rx="12" fill="#f6c343" stroke="#a86d0c" stroke-width="5"/><path d="M60 78 Q62 100 54 108 Q50 116 58 116 Q66 116 64 104 Q66 92 72 80Z" fill="#ffcf3f"/><text x="100" y="152" text-anchor="middle" font-family="'Playfair Display',Georgia" font-weight="900" font-size="26" fill="#7a4a08">HONEY</text>${u.silver||u.gold?`<path d="M126 60 L170 4" stroke="${u.gold?"#d4af37":"#c0c0c0"}" stroke-width="9" stroke-linecap="round"/><ellipse cx="128" cy="58" rx="13" ry="16" fill="${u.gold?"#d4af37":"#c0c0c0"}"/>`:""}${u.crown?`<path d="M62 52 L66 20 L84 38 L100 10 L116 38 L134 20 L138 52Z" fill="#d4af37" stroke="#8a6d10" stroke-width="3"/><circle cx="100" cy="30" r="5" fill="#d8576b"/>`:""}</svg>${Array.from({length:bees},(_,i)=>`<span class="bee" style="animation-delay:${-i*.7}s;animation-duration:${4+i%3}s">🐝</span>`).join("")}`}
function potClick(e){sndInit();applySound();S.clicks=(S.clicks||0)+1;let n=(6+Math.random()*18)*mult(),big="";const jc=S.up.crown?.08:.045;const r=Math.random();if(r<.004){n*=50;big="ROYAL JACKPOT!"}else if(r<jc){n*=10;big="JACKPOT!"}
 const got=earn(n);sfx(big?"jackpot":"coin");const pot=$("#pot");pot.classList.remove("bop");void pot.offsetWidth;pot.classList.add("bop");
 const s=document.createElement("span");s.className="potfloat"+(big?" big":"");s.textContent=(big?big+" ":"")+"+"+fmt(got);pot.appendChild(s);setTimeout(()=>s.remove(),1500);
 for(let i=0;i<(big?14:3);i++){const c=document.createElement("span");c.className="drop";c.textContent=big?"🪙":"🍯";c.style.setProperty("--dx",(Math.random()*160-80)+"px");c.style.animationDelay=i*.03+"s";pot.appendChild(c);setTimeout(()=>c.remove(),1100)}}
/* ---------- month effects ---------- */
function renderFX(){const M=MONTHS[curMonth()],fx=$("#fx");fx.innerHTML=Array.from({length:14},(_,i)=>`<span style="left:${(i*7.3+3)%100}%;animation-delay:${-i*1.3}s;animation-duration:${9+(i%5)*2}s">${M.fx[i%M.fx.length]}</span>`).join("")}
function applySound(){if(!SND.ctx)return;SND.musicOn=S.snd.music;sndMute(S.snd.muted);sndVolume(S.snd.vol);const b=B(),v=b.view;let p=CITIES[b.loc].sound||"bern";
 if(v.t=="castle")p="castle";else if(v.t=="hotel")p="hotel";else if(v.t=="window")p="window";else if(v.t=="shopin")p=v.shop.endsWith("_food")?"cafe":"shop";else if(v.t=="inside"){const a=att(b.loc,v.aid);if(a&&["boat","ship"].includes(a.k))p="boat";else if(a&&["museum","library","house"].includes(a.k))p="museum";else if(a&&a.k=="aquarium")p="aquarium";else if(a&&a.k=="ballpark")p="ballpark";else if(a&&a.k=="theater")p="theater";else if(a&&a.k=="market")p="market"}if(b.loc=="boston"&&p=="boston")p="harbor";setSound(p)}

/* ============ GAME: shops, modals, actions ============ */
function openModal(title,body,cls){const m=$("#modal");m.className="show "+(cls||"");m.innerHTML=`<div class="sheet" role="dialog" aria-label="${esc(title)}"><div class="mh"><h2>${title}</h2><button class="x" data-act="close" aria-label="Close">✕</button></div><div class="mb">${body}</div></div>`;m.querySelector(".mb").scrollTop=0}
function closeModal(){$("#modal").className="";$("#modal").innerHTML=""}
function toast(t){const box=$("#toasts");while(box.children.length>=3)box.firstChild.remove();const el=document.createElement("div");el.className="toast";el.textContent=t;$("#toasts").appendChild(el);setTimeout(()=>el.classList.add("out"),3600);setTimeout(()=>el.remove(),4200)}
const shown={};function toastOnce(k,t){if(shown[k])return;shown[k]=1;toast(t)}
function away(){return B().loc!="bern"}
function ownedWear(id){return!!S.ward[id]}
function itemCard(I,btns,extra){return`<div class="card"><div class="ic">${I.c=="wear"?bearMini(I,B().color):I.c=="furniture"?`<svg viewBox="${furnVB(I.k)}">${furnSVG(I.k,I.col)}</svg>`:I.c=="food"?foodSVG(I.id,"cardfood"):esc(I.i||"✨")}</div><div class="cn"><b>${esc(I.n)}</b><small>${extra||(I.p?"🍯 "+fmt(I.p):"")}</small></div><div class="cb">${btns}</div></div>`}
function wearIcon(I){const m={outfit:"👗",head:"👒",feet:"👠",neck:"📿",ears:"💎",wrist:"💍",watch:"⌚",bag:"👜"};if(I.st=="lederhosen")return"🩳";if(["alpine","waistcoat","tweed","coat","sweater","tee"].includes(I.st))return I.st=="coat"||I.st=="tweed"?"🧥":"👔";if(I.st=="tiara")return"👑";if(I.st=="tophat"||I.st=="felthat")return"🎩";if(I.st=="cap")return"🧢";if(I.st=="beret")return"🎨";if(I.st=="clogs")return"👞";if(I.st=="boots")return"🥾";if(I.st=="scarf")return"🧣";if(I.st=="pocketwatch")return"⌚";return m[I.slot]||"👗"}
function shopItems(shop){return Object.values(ITEMS).filter(i=>i.shop==shop)}
function openShop(shop,opt){opt=opt||{};const Sh=SHOPS[shop];let list=shopItems(shop);if(opt.stand)list=[ITEMS.bratwurst];if(opt.slots)list=list.filter(i=>i.c=="wear"&&opt.slots.includes(i.slot));if(opt.filter)list=list.filter(i=>opt.filter.includes(i.c=="furniture"?i.k:i.c));
 const body=`<p class="lede">${esc(Sh.sub)}${away()&&(shop.indexOf(B().loc)==0||STORES[shop])?" · Things you buy here go into "+esc(B().name)+"'s suitcase until you unpack at home.":""}</p><div class="grid">${list.map(I=>itemCard(I,shopBtns(I))).join("")}</div>`;
 openModal(opt.stand?"🌭 Sausage & Sauerkraut Stand":opt.title?esc(Sh.n)+" · "+esc(opt.title):esc(Sh.n),body,"shopm");curShop={shop,opt}}
let curShop=null;
function shopBtns(I){if(I.c=="food")return`<button class="btn small" data-act="buyEat" data-arg="${I.id}">Eat now</button><button class="btn small ghost" data-act="buy" data-arg="${I.id}">Take one home</button>`;
 if(I.c=="wear")return ownedWear(I.id)?`<button class="btn small ghost" data-act="wearNow" data-arg="${I.id}">Owned ✓ · Wear</button>`:`<button class="btn small" data-act="buyWear" data-arg="${I.id}">Buy & wear</button><button class="btn small ghost" data-act="buy" data-arg="${I.id}">Buy</button>`;
 const have=S.inv[I.id]||0;return`<button class="btn small" data-act="buy" data-arg="${I.id}">Buy</button>${have?`<span class="have">${have} in storage</span>`:""}`}
function refreshShop(){if(curShop&&$("#modal").classList.contains("shopm")){const sc=$("#modal .mb").scrollTop;openShop(curShop.shop,curShop.opt);$("#modal .mb").scrollTop=sc}else if(curCat&&$("#modal").classList.contains("catm")){const sc=$("#modal .mb").scrollTop;openCatalog(curCat.tab,curCat.q);$("#modal .mb").scrollTop=sc}}
function pay(price,then,label){if(spend(price))return then();const short=price-S.coins;openConfirm(`You need ${fmt(short)} more Honey Coins for ${esc(label)}.`,`Borrow ${fmt(short)} from the Bear Bank`,()=>{borrow(short);spend(price);then();refreshShopLater()},"Zero interest, no deadlines. Half of each Honey Pot click pays it back automatically.")}
let pendingRefresh=null;function refreshShopLater(){}
function openConfirm(msg,yes,fn,sub){const back=$("#modal").innerHTML,cls=$("#modal").className;const box=document.createElement("div");box.className="confirm";box.innerHTML=`<div class="cbox"><p>${msg}</p>${sub?`<small>${esc(sub)}</small>`:""}<div class="row"><button class="btn gold" id="cyes">${esc(yes)}</button><button class="btn ghost" id="cno">Not now</button></div></div>`;document.body.appendChild(box);
 box.querySelector("#cyes").onclick=()=>{box.remove();fn();refreshShop()};box.querySelector("#cno").onclick=()=>box.remove()}
function deliver(id,n){n=n||1;const I=ITEMS[id],b=B();const fromTrip=away()&&I.o==b.loc&&(curShop&&curShop.shop.indexOf(b.loc)==0||I.shop&&STORES[I.shop]);
 if(fromTrip){for(let k=0;k<n;k++)b.suit.neu.push(id);return"suitcase"}
 if(I.c=="wear")S.ward[id]=1;else S.inv[id]=(S.inv[id]||0)+n;return"home"}
function buy(id,after){const I=ITEMS[id];pay(I.p,()=>{const where=deliver(id);sfx("buy");toast(where=="suitcase"?`🧳 ${I.n} packed into ${B().name}'s suitcase!`:I.c=="wear"?`👗 ${I.n} is in your castle wardrobe.`:`📦 ${I.n} delivered to your castle storage.`);after&&after();save();refreshShop()},I.n)}
function wearItem(id,col){const I=ITEMS[id],b=B();const cur=b.wear[I.slot];if(cur&&cur.id==id&&!col){delete b.wear[I.slot]}else b.wear[I.slot]={id,col:col||(cur&&cur.id==id?cur.col:null)};save();refreshBear();react("twirl")}
function refreshBear(){const b=B();stage().querySelectorAll(`.bear[data-b="${b.id}"] .bwrap`).forEach(el=>el.innerHTML=bearSVG(b,"happy"));$("#bears").querySelectorAll(".chip.on .av").forEach(el=>el.innerHTML=bearHead(b))}
/* ---------- catalog ---------- */
let curCat=null;
const CAT_TABS=[["bears","Bears"],["wings","Castle wings"],["honey","Honey upgrades"],["furniture","Furniture"],["decor","Decor"],["clothes","Clothes"],["jewelry","Jewelry"],["groceries","Groceries"],["souvenirs","Travel souvenirs"]];
function openCatalog(tab,q){tab=tab||"furniture";q=q||"";curCat={tab,q};curShop=null;let body=`<div class="ctabs">${CAT_TABS.map(t=>`<button class="tab ${t[0]==tab?"on":""}" data-act="catTab" data-arg="${t[0]}">${t[1]}</button>`).join("")}</div>`;
 if(tab=="bears"){body+=`<p class="lede">Every new bear moves into their own multi-room Victorian castle. 🍯 2,500 each.</p><div class="newbear"><label>Name <input id="nbName" value="${esc(pick(SWISS_NAMES.filter(n=>!S.bears.some(b=>b.name==n)))||"Bärli")}" maxlength="18"></label><div class="names">${SWISS_NAMES.slice(0,16).map(n=>`<button class="tag2" data-act="nbName" data-arg="${esc(n)}">${esc(n)}</button>`).join("")}</div><div class="colors">${Object.entries(BEAR_COLORS).map(([k,c],i)=>`<label class="bc"><input type="radio" name="nbc" value="${k}" ${i==0?"checked":""}><span>${bearHead({color:k,wear:{}})}</span>${c.label}</label>`).join("")}</div><div class="row"><label class="bc2"><input type="radio" name="nbs" value="girl" checked> Girl bear</label><label class="bc2"><input type="radio" name="nbs" value="boy"> Boy bear</label></div><button class="btn gold big" data-act="buyBear">Adopt this bear · 🍯 2,500</button></div>`}
 else if(tab=="wings"){body+=`<p class="lede">Add a new room to any bear's castle. 🍯 1,500 each.</p><label class="lbl">Castle of <select id="wingBear">${S.bears.map(b=>`<option value="${b.id}" ${b.id==S.active?"selected":""}>${esc(b.name)}</option>`).join("")}</select></label><div class="grid">${WINGS.map(w=>`<div class="card"><div class="ic">${{music:"🎹",conservatory:"🌿",library:"📚",tea:"🫖",ballroom:"💃",garden:"🌹",play:"🧸",gallery:"🖼️"}[w[1]]}</div><div class="cn"><b>${w[0]}</b><small>🍯 1,500</small></div><div class="cb"><button class="btn small" data-act="buyWing" data-arg="${w[1]}">Add wing</button></div></div>`).join("")}</div>`}
 else if(tab=="honey"){body+=`<p class="lede">Make every Honey Pot click worth more. Right now each click is worth about ${fmt(15*mult())} coins.</p><div class="grid">${UPGRADES.map(u=>{const lvl=S.up[u.id],done=u.stack?lvl>=u.stack:lvl>0;const price=u.stack?Math.round(u.p*Math.pow(1.35,lvl)):u.p;return itemCard({n:u.n,i:{silver:"🥄",gold:"🏆",crown:"👑",bees:"🐝"}[u.id],c:"x"},done?`<span class="have">Owned ✓</span>`:`<button class="btn small" data-act="buyUp" data-arg="${u.id}">Buy · 🍯 ${fmt(price)}</button>`,u.d+(u.stack?` · you have ${lvl}`:""))}).join("")}</div>`}
 else{const f={furniture:i=>i.c=="furniture"&&i.p>0,decor:i=>i.c=="decor"&&i.p>0&&i.o=="bern",clothes:i=>i.c=="wear"&&i.p>0&&!["neck","ears","wrist","watch"].includes(i.slot),jewelry:i=>i.c=="wear"&&i.p>0&&["neck","ears","wrist","watch"].includes(i.slot)||i.st=="tiara",groceries:i=>i.c=="food",souvenirs:i=>i.o!="bern"&&i.p>0&&i.c!="food"&&!i.shop.match(/macys|saks|bergdorf|tiffany|bloomies/)}[tab];
  let list=Object.values(ITEMS).filter(f);if(q)list=list.filter(i=>i.n.toLowerCase().includes(q.toLowerCase()));
  body+=`<input class="search" id="catq" placeholder="Search ${tab}…" value="${esc(q)}"><div class="grid">${list.map(I=>itemCard(I,I.c=="food"?`<button class="btn small" data-act="buy" data-arg="${I.id}">Buy</button>${S.inv[I.id]?`<span class="have">${S.inv[I.id]} in pantry</span>`:""}`:shopBtns(I),(I.p?"🍯 "+fmt(I.p):"")+(I.o!="bern"?" · from "+CITIES[I.o].n.split(/[,&]/)[0]:""))).join("")}</div>`}
 openModal("📖 Town Catalog",body,"catm");const qi=$("#catq");if(qi){qi.oninput=()=>{clearTimeout(qi._t);qi._t=setTimeout(()=>{openCatalog(tab,qi.value);const n=$("#catq");n.focus();n.setSelectionRange(n.value.length,n.value.length)},250)}}}
/* ---------- bank ---------- */
function openBank(){openModal("🏦 Bear Bank",`<div class="bank"><div class="bal"><div><small>Honey Coins</small><b>🍯 ${fmt(S.coins)}</b></div><div><small>Loan owed</small><b>${fmt(S.loan)}</b></div></div><p class="lede">Borrow any time. Zero interest, no penalties, no due dates. Half of every Honey Pot click goes toward paying it back until it's gone.</p><div class="row wrap">${[500,2000,10000,50000].map(n=>`<button class="btn gold" data-act="loan" data-arg="${n}">Borrow ${fmt(n)}</button>`).join("")}</div>${S.loan>0?`<div class="row"><button class="btn ghost" data-act="repay">Pay back ${fmt(Math.min(S.loan,S.coins))} now</button></div>`:""}</div>`)}
/* ---------- travel ---------- */
function openTravel(mode){const b=B();const list=Object.entries(CITIES).filter(([k,c])=>k!=b.loc&&(k=="bern"||c.travel==mode));
 openModal(mode=="plane"?"✈️ International Airport":"🚆 Train Station",`<p class="lede">${mode=="plane"?"Fly to the U.S.":"Ride the rails around Europe"} — tickets are 🍯 20, and you arrive instantly. ${b.suit.packed.length?"":"<br>💡 Tip: pack your suitcase in the castle bedroom first so you can change outfits at your hotel."}</p><div class="dest">${list.map(([k,c])=>`<button class="destb" data-act="travel" data-arg="${k}"><span class="dn">${esc(c.n)}</span><span class="ds">${esc(k=="bern"?"Home · Bern, Switzerland":c.sub)}</span><span class="dt">${k=="bern"?"Free":"🎫 Buy ticket & go"}</span></button>`).join("")}</div>`)}
function travel(ck){const b=B();const go2=()=>{closeModal();sfx("whoosh");const ov=$("#travelov");ov.innerHTML=`<div>${CITIES[b.loc].travel=="plane"||CITIES[ck].travel=="plane"?"✈️":"🚆"}</div><p>Off to ${esc(CITIES[ck].n)}!</p>`;ov.className="show";setTimeout(()=>{ov.className=""},850);
  setTimeout(()=>{b.loc=ck;b.view={t:"street"};b.x=ck=="bern"?420:220;b.roomPos=null;save();renderAll();if(ck=="bern"&&b.suit.neu.length)toast(`🧳 ${b.name} has ${b.suit.neu.length} new treasure${b.suit.neu.length>1?"s":""} to unpack — open the suitcase!`)},380)};
 if(ck=="bern")return go2();pay(20,go2,"a ticket")}
function goHome(){const b=B();if(b.loc!="bern"){travel("bern");return}b.view={t:"street"};b.roomPos=null;save();renderAll()}
/* ---------- castles ---------- */
function openCastleList(){openModal("🏰 Castle Lane",`<p class="lede">Every bear has a castle. Pop in to visit anyone.</p><div class="grid">${S.bears.map(x=>`<div class="card"><div class="ic av">${bearHead(x)}</div><div class="cn"><b>${esc(x.name)}'s Castle</b><small>${x.castle.rooms.length} rooms</small></div><div class="cb"><button class="btn small" data-act="enterCastle" data-arg="${x.id}">Go inside</button></div></div>`).join("")}</div>`)}
function enterCastle(ownerId){const b=B();if(b.loc!="bern"){b.loc="bern";}const o=bearById(ownerId)||b;b.view={t:"castle",owner:o.id,room:"parlor"};b.roomPos=null;decorate=false;selU=null;gather=false;closeModal();save();renderAll()}
function curRoom(){const b=B(),o=bearById(b.view.owner)||b;return o.castle.rooms.find(r=>r.id==b.view.room)||o.castle.rooms[0]}
function curItem(){return curRoom().items.find(i=>i.u==selU)}
/* ---------- dept stores ---------- */
function openDept(st){openModal("🎄 "+esc(STORES[st].n),`<p class="lede">The holiday window sparkles, and the doors are open.</p><div class="row wrap"><button class="btn gold big" data-act="window" data-arg="${st}">✨ Look at the holiday window</button><button class="btn big" data-act="storeIn" data-arg="${st}">🚪 Walk inside the store</button></div>`)}
/* ---------- wardrobe & suitcase ---------- */
const SLOTS=[["outfit","Outfits"],["head","Hats & tiaras"],["feet","Shoes"],["neck","Necklaces & scarves"],["ears","Earrings"],["wrist","Bracelets"],["watch","Pocket watches"],["bag","Bags"]];
function wardrobeIds(){const b=B();if(away()){const s=new Set(b.suit.packed.concat(b.suit.neu.filter(i=>ITEMS[i]&&ITEMS[i].c=="wear")));return[...s]}return Object.keys(S.ward)}
function openWardrobe(){const b=B(),ids=wardrobeIds();const cur=b.wear.outfit;let body=`<p class="lede">${away()?"Clothes packed in "+esc(b.name)+"'s suitcase (plus anything bought on this trip).":"Everything in the castle wardrobe. Tap to put on, tap again to take off."}</p>`;
 if(cur)body+=`<div class="swrow"><span>Dress color:</span>${SWATCHES.map(s=>`<button class="swb" title="${s[0]}" style="background:${s[1]}" data-act="outCol" data-arg="${s[1]}"></button>`).join("")}<input type="color" id="outColPick" value="${cur.col||ITEMS[cur.id].col}" title="Any color"></div>`;
 SLOTS.forEach(([sl,nm])=>{const L=ids.filter(i=>ITEMS[i]&&ITEMS[i].slot==sl);if(!L.length)return;body+=`<h3>${nm}</h3><div class="grid tight">${L.map(i=>{const I=ITEMS[i],on=b.wear[sl]&&b.wear[sl].id==i;return`<button class="wcard ${on?"on":""}" data-act="wear" data-arg="${i}"><span class="wmini">${bearMini(I,b.color)}</span><small>${esc(I.n)}</small>${on?"<em>wearing</em>":""}</button>`}).join("")}</div>`});
 if(!ids.length)body+=`<p class="empty">${away()?"The suitcase is empty — next time, pack before your trip! You can still buy outfits here.":"No clothes yet — visit the Boutique or the Town Catalog."}</p>`;

 buyUp:id=>{const u=UPGRADES.find(x=>x.id==id),lvl=S.up[id],price=u.stack?Math.round(u.p*Math.pow(1.35,lvl)):u.p;pay(price,()=>{S.up[id]=lvl+1;save();renderPot();sfx("jackpot");toast(`✨ ${u.n}! Each click is now worth about ${fmt(15*mult())} coins.`);refreshShop()},u.n)},
 loan:n=>{borrow(+n);sfx("coin");openBank();toast(`🏦 ${fmt(+n)} Honey Coins borrowed — zero interest!`)},repay:()=>{const p=Math.min(S.loan,S.coins);S.coins-=p;S.loan-=p;save();renderCoins();openBank()},
 travel:ck=>travel(ck),enterCastle:id=>enterCastle(id),
 window:st=>{closeModal();go({t:"window",store:st})},storeIn:st=>{closeModal();go({t:"shopin",shop:st})},
 backStreet:()=>{go({t:"street"})},
 chip:a=>{const b=B();if(a=="look")react("wonder");else if(a=="breeze")react("breeze");else if(a=="wish"){if(S.coins>=1)S.coins-=1;renderCoins();react("wish")}else if(a=="nap"){const el=stage().querySelector(".bear.center");el.classList.add("napping");el.querySelector(".bwrap").innerHTML=bearSVG(b,"sleep");sfx("zzz");react("nap")}else if(a=="suitcase")openSuitcase();else if(a.startsWith("eat:"))eat(ITEMS[a.slice(4)]);else if(a.startsWith("store:"))go({t:"shopin",shop:a.slice(6)});else if(a.startsWith("real:"))realWalk(a.slice(5))},
 room:id=>{B().view.room=id;B().roomPos=null;selU=null;gather=false;save();renderLoc();renderCastle()},
 decorate:()=>{decorate=!decorate;selU=null;gather=false;renderCastle()},colors:()=>openColors(),place:()=>openPlace(),placeIt:id=>placeIt(id),
 roomCol:a=>{const[k,c]=a.split("|");curRoom()[k]=c;save();renderCastle();openColors()},
 itRot:()=>{const it=curItem();if(it){it.r=((it.r||0)+15)%360;if(it.r>180)it.r-=360;save();renderCastle()}},itFlip:()=>{const it=curItem();if(it){it.f=!it.f;save();renderCastle()}},itColor:()=>openItemColor(),itCol:c=>{const it=curItem();if(it){it.col=c;save();renderCastle()}},
 itFront:()=>{const r=curRoom(),i=r.items.findIndex(x=>x.u==selU);if(i>=0){r.items.push(r.items.splice(i,1)[0]);save();renderCastle()}},
 itStore:()=>{const r=curRoom(),i=r.items.findIndex(x=>x.u==selU);if(i<0)return;const it=r.items[i];if(it.id=="suitcase"){toast("The suitcase stays in the bedroom — but you can move it anywhere there!");return}r.items.splice(i,1);if(!it.free)S.inv[it.id]=(S.inv[it.id]||0)+1;selU=null;save();renderCastle();toast(it.free?"Feast platter cleared.":"📥 Put away in castle storage.")},
 feast:()=>openFeast(),summon:id=>summon(id),bell:()=>ringBell(),suitcase:()=>openSuitcase(),wardrobe:()=>openWardrobe(),
 wear:id=>{wearItem(id);openWardrobe()},outCol:c=>{const b=B();if(b.wear.outfit){b.wear.outfit.col=c;save();refreshBear();react("twirl");openWardrobe()}},
 pack:id=>{const s=B().suit;const i=s.packed.indexOf(id);i>=0?s.packed.splice(i,1):s.packed.push(id);save();openSuitcase()},packCam:()=>{B().suit.camera=!B().suit.camera;save();openSuitcase()},packSnack:id=>{const s=B().suit;const i=s.snacks.indexOf(id);i>=0?s.snacks.splice(i,1):s.snacks.push(id);save();openSuitcase()},
 snack:id=>{closeModal();eat(ITEMS[id])},unpack:()=>unpack(),
 sendCard:()=>sendCard(),camera:()=>camera(),album:()=>openAlbum(),passport:()=>openPassport(),delPhoto:i=>{S.photos.splice(+i,1);save();openAlbum()},
 story:()=>openStory(),nextStory:()=>unlockStory(false),newAdv:()=>unlockStory(true),
 settings:()=>openSettings(),gift:()=>openGift(),
 home:()=>{closeModal();goHome()},castle:()=>{closeModal();enterCastle(B().id)},catalog:()=>openCatalog(),
 sound:()=>{sndInit();S.snd.muted=!S.snd.muted;save();applySound();renderDock();toast(S.snd.muted?"🔇 Sound off":"🔊 Sound on")},
 copySave:()=>{const code=btoa(unescape(encodeURIComponent(JSON.stringify(S))));const box=$("#saveBox");box.value=code;box.select();try{navigator.clipboard.writeText(code).then(()=>toast("📋 Backup code copied — keep it somewhere safe!"),()=>toast("Backup code is in the box below — copy it from there."))}catch(e){toast("Backup code is in the box below — copy it from there.")}},
 loadSave:()=>{const v=$("#saveBox").value.trim();if(!v){toast("Paste a backup code into the box first.");return}try{const o=JSON.parse(decodeURIComponent(escape(atob(v))));if(!o.bears)throw 0;openConfirm("Replace this game with the backup?","Yes, restore it",()=>{S=o;save();closeModal();renderAll();toast("✅ Backup restored!")})}catch(e){toast("That code didn't work — make sure you copied all of it.")}}
};
/* ---------- boot ---------- */
function migrate(){S.up=S.up||{silver:0,gold:0,crown:0,bees:0};S.snd=S.snd||{vol:.55,muted:false,music:true};S.story=S.story||{first:todayStr(),list:[]};S.bears.forEach(b=>{b.suit=b.suit||{packed:[],snacks:[],camera:true,neu:[]};b.view=b.view||{t:"street"};if(!CITIES[b.loc])b.loc="bern"});if(!bearById(S.active))S.active=S.bears[0].id}
function boot(){if(!load())newState();migrate();
 document.addEventListener("click",e=>{const el=e.target.closest("[data-act]");if(el){e.preventDefault();sndInit();applySound();const f=ACT[el.dataset.act];f&&f(el.dataset.arg,el,e)}});
 $("#modal").addEventListener("click",e=>{if(e.target.id=="modal")closeModal()});
 document.addEventListener("keydown",e=>{if(e.key=="Escape"){if($("#realwalk").classList.contains("show"))ACT.closeWalk();else closeModal()}});
 $("#loadfile").addEventListener("change",e=>readSaveFile(e.target.files[0]));
 $("#pot").addEventListener("pointerdown",e=>{e.preventDefault();potClick(e)});
 document.addEventListener("pointerdown",()=>{if(sndInit())applySound()},{once:true});
 renderAll();renderDock();renderSaved();
 if(!S.seenWelcome){S.seenWelcome=1;save();openModal("Welcome to Bärengraben Castle 🐻",`<div class="welcome"><div class="trio">${S.bears.map(b=>`<span>${bearSVG(b,"happy")}</span>`).join("")}</div><p class="lede">Christina, Matthew and Lizzie are home in Bärengraben Castle, a cozy Victorian town on the turquoise river, just like Bern.</p><ul><li><b>Tap the Giant Honey Pot</b> as often as you like for Honey Coins. Every tap gives a different amount, and some are jackpots!</li><li><b>Tap any building</b> to walk over and go inside: shops, the Bear Pit, the Bear Bank, the train station and the airport.</li><li><b>Pick your bear</b> along the top. <b>🏰 My Castle</b> takes you home to decorate, and <b>🏠 Home</b> brings you back to Bern from anywhere.</li><li>There are no timers and nothing expires. Everything saves by itself, and the <b>💾 Save Game</b> button up top saves any time you like. It can also download a save file to your computer.</li></ul><button class="btn gold big" data-act="close">Let's go!</button></div>`)}
 setTimeout(()=>cloudInit(0),600)}
window.addEventListener("DOMContentLoaded",boot);

</script>
